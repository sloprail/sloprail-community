# The examples' e2e, run inside sloprail at the version SLOPRAIL_VERSION pins.
# See "Examples" in README.md for why they run in a sloprail checkout.
name: examples

on:
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: examples e2e (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - name: read the pinned sloprail version
        id: pin
        run: echo "ref=$(tr -d '[:space:]' < SLOPRAIL_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: sloprail/sloprail
          ref: ${{ steps.pin.outputs.ref }}
          path: sloprail
      - uses: actions/setup-go@v5
        with:
          go-version-file: sloprail/go.mod
          cache: true
          cache-dependency-path: sloprail/go.sum
      - name: e2e
        run: scripts/run-examples-shard.sh sloprail ${{ matrix.shard }} 6

  # One stable name for branch protection.
  all:
    name: examples e2e (all)
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.e2e.result }}
        run: '[ "$RESULT" = success ]'
