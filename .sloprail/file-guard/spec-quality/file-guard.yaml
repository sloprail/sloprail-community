# Every changed spec invariant and entity is judged against the document-invariant /
# document-entity skills (.claude/skills/). The changed files are grouped by what they
# constrain (subjects.py, speclib.buckets): every changed invariant that mentions a field or
# entity lands in one group with all the others that mention it, whatever their domain, so
# the judge checks each such pair for a conflict; an invariant may be in several groups, and
# groups are merged up to 30 members to keep the judge calls few. Unchanged invariants that
# share a field or entity with a member come along as context for that pairwise check. A
# group's fingerprint covers the skills, the cited entities that are not in it and those
# related invariants, so a change to any of them re-judges only the groups that read it.
match: path matches "^examples/.+/spec/[a-z0-9-]+/(invariants|entities)/[^/]+\\.yaml$"
subjects: ./subjects.py
checks:
  - script: ./shape.py
  - script: ./mentions-resolve.py
  - prepare: ./prepare.py
    judge: ./judge.md.j2
    model: size-md
