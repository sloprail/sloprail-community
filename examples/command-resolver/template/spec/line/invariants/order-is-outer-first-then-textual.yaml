predicate: >-
  In a {@ent:line:Line} whose {@fld:line:Line.text} is written in the {@ent:line:Grammar},
  with quotes, substitutions, expansions and compound commands nested in one another at most
  two deep, {@fld:line:Resolution.invocations} lists its simple commands in the order
  written, each directly followed by the {@ent:line:Invocation}s it gives rise to, each of
  those followed in turn by its own: first the program it runs as a {@ent:config:Wrapper},
  or the commands of its {@ent:wrappers:FindClause}s in clause order, then the commands of
  its {@ent:command-strings:CommandString}, then the commands of the {@ent:line:Scope}s
  whose {@fld:line:Scope.kind} is command-substitution or process-substitution in its
  written words (each a {@fld:words:Word.text}, its `NAME=value` words included), the
  {@fld:line:Redirection.word}s of its {@ent:line:Redirection}s and its
  {@fld:stdin:HereDocument.body}s, in the order written; a written word that is also a
  written word of an {@ent:line:Invocation} it gives rise to (a {@ent:config:Wrapper}'s
  wrapped program and its words) belongs to the innermost such {@ent:line:Invocation} only.
  The commands of such a {@ent:line:Scope} that belongs to no simple command stand where it
  is written.
why: >-
  Two resolvers would list the same programs in different orders.
