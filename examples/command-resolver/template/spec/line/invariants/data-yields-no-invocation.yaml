predicate: >-
  The literal text of a quoted string, of a comment and of a here-document body is never
  read as commands: an {@ent:line:Invocation} comes from it only through the
  {@fld:words:Word.value} of a word of a command (a quoted program word included), as the
  text of a {@ent:command-strings:CommandString}, as the string `env -S` splits, or from a
  command or process substitution it holds outside single quotes and outside a here-document
  whose delimiter is quoted.
why: >-
  A program name that is only mentioned would be reported as run.
