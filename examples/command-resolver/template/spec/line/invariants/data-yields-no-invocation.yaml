predicate: >-
  The literal text of a quoted string, of a comment and of a {@fld:stdin:HereDocument.body}
  is never read as commands: an {@ent:line:Invocation} comes from it only through the
  {@fld:words:Word.value} of a {@ent:words:Word} of a command (a quoted program word
  included), as the {@fld:command-strings:CommandString.text} of a
  {@ent:command-strings:CommandString}, as the string
  wrappers/env-split-string-is-one-command splits, or from a command or process substitution
  it holds outside single quotes and outside the {@fld:stdin:HereDocument.body} of a
  {@ent:stdin:HereDocument} whose {@fld:stdin:HereDocument.quotedDelimiter} is true.
why: >-
  A program name that is only mentioned would be reported as run.
