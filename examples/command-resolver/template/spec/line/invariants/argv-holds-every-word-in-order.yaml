  from the value of env's `-S` option has as its {@fld:line:Invocation.argv}, in the order
  written, the {@ent:words:Word}s the written words of its command yield from its program
  word on, none from a `NAME=value` word before it, a {@ent:line:Redirection} or a
  {@fld:stdin:HereDocument.body}; a written word yields one {@ent:words:Word}, but where
  words/brace-expansion-yields-several-words, variables/unquoted-substitution-splits or
  words/comment-yields-no-word says otherwise.
