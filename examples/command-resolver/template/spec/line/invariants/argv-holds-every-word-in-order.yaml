predicate: >-
  An {@ent:line:Invocation} whose program word is the first written word of its simple
  command that is neither a `NAME=value` word nor part of a {@ent:line:Redirection} has as its {@fld:line:Invocation.argv}
  the {@ent:words:Word}s that the written words of that simple command yield, in the order
  written, from its program word on; none from a {@ent:line:Redirection} or a
  {@fld:stdin:HereDocument.body}. A written word yields one {@ent:words:Word}, but where
  words/brace-expansion-yields-several-words, variables/unquoted-substitution-splits or
  words/comment-yields-no-word says otherwise.
why: >-
  A consumer could not tell `git -C $(x) push` from `git -C push`.
