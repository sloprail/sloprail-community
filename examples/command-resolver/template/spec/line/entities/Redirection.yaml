doc: >-
  A redirection written on a command or on a group, subshell or compound command: an operator
  of the Grammar's redirection operators, with the descriptor number written before it, if any,
  and the word written after it.
fields:
  - name: operator
    type: string
    doc: "The operator as written."
    enum: ["<", ">", ">|", ">>", "<>", "<&", ">&", "<<", "<<-", "<<<"]
  - name: word
    type: words.Word?
    doc: "The word written after the operator: a file name, a descriptor or a here-string. Absent exactly when the operator is << or <<-, whose delimiter is no Word: the shell expands nothing in it, and stdin.HereDocument holds whether it is quoted."
