doc: >-
  A program whose arguments are the argument vector of another program it runs. Its own words
  are those before the program it runs; among them an option is a word that starts with `-` and
  comes before the first `--` that is no option's value (that `--` ends its options), and a bare
  word is a word that is neither an option, nor an option's value, nor that `--`. The value of
  one of its valueOptions is the word after it, or, written in the same word, the characters
  after a one-letter single-dash option, written alone or after other one-letter options in one
  cluster (`-uroot`, `-tI{}`), or after the `=` of a double-dash one (`--user=root`).
fields:
  - name: name
    type: string
    doc: "The program's name."
  - name: valueOptions
    type: string[]
    doc: "Its options that take a value, as the doc says it is written."
  - name: leadingOperands
    type: int32
    doc: "How many bare words it takes before the wrapped program."
    constraint_expr: '>= 0'
  - name: takesAssignments
    type: bool
    doc: "Whether NAME=value words before the wrapped program are assignments for it."
  - name: describingOptions
    type: string[]
    doc: "Its options that make it describe, list or edit instead of running a program."
  - name: directoryOptions
    type: string[]
    doc: "Its options that name the directory the wrapped program runs in."
  - name: requiredOptions
    type: string[]
    doc: "Options of which one must be given for it to run a program at all; empty when it always does."
