doc: >-
  A program whose arguments are the argument vector of another program it runs. A test below of
  what a word starts with, holds or is equal to reads its words.Word.value. Its words, after
  its program word, are read left to right: while no bare word and no `--` has been read, a word
  that starts with `-` and is no option's value is an option, and the first `--` that is no
  option's value ends the options and is neither an option nor a bare word; any other word that
  is no option's value is a bare word. The value of one of its valueOptions is the word after
  it, or, written in the same word, the characters after a one-letter single-dash option,
  written alone or after other one-letter options in one cluster (`-uroot`, `-tI{}`), or after
  the `=` of a double-dash one (`--user=root`). The letters of a single-dash cluster that is no option's value run up to the first whose `-x` is one of its valueOptions, that one included, which takes the rest of the word or, when none is left, the word after it as its value. An option is given when one of its options is a word equal to it or, a one-letter one, a letter of such a cluster. A word before the wrapped program's word names one of its
  directoryOptions when it is equal to it, starts with it followed by `=` (a double-dash one),
  or has its letter among the letters of a single-dash cluster (a one-letter one). The chain of an Invocation is the Wrapper whose wrapped program it is, that Wrapper's
  own, and so on, command and builtin included; an Invocation that is no wrapped program has
  an empty chain. An option word of a Wrapper is a word of its own, after its program word
  and before the word of the program it runs, whose words.Word.value starts with `-` or is
  absent.
fields:
  - name: name
    type: string
    doc: "The program's name."
  - name: valueOptions
    type: string[]
    doc: "Its options that take a value, as the doc says it is written."
  - name: leadingOperands
    type: int32
    doc: "How many bare words it takes before the wrapped program."
    constraint_expr: '>= 0'
  - name: takesAssignments
    type: bool
    doc: "Whether NAME=value words before the wrapped program are assignments for it."
  - name: describingOptions
    type: string[]
    doc: "Its options that make it describe, list or edit instead of running a program."
  - name: directoryOptions
    type: string[]
    doc: "Its options that name the directory the wrapped program runs in."
  - name: requiredOptions
    type: string[]
    doc: "Options of which one must be given for it to run a program at all; empty when it always does."
