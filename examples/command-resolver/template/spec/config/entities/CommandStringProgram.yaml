doc: >-
  A program that runs one of its arguments as a shell command line. Among its arguments, an
  option is a word that starts with `-` or `+` and comes before any `--`. The options that take
  a value are those in valueOptions and, for one whose form is option, `-c` and `--command`. A
  word is the value of an option when it follows, as a separate word, an option that takes a
  value, or a single-dash cluster one of whose letters x after the first has `-x` taking a
  value, each such letter taking the next unused word in the order of the letters, unless the
  letter is the cluster's last and characters follow it in the same word. An option's value may
  also be attached: what follows `=` in a word `--name=value` whose `--name` takes a value, and
  what follows the letter x in a single-dash word whose `-x` takes a value. Any other word is a
  bare word.
fields:
  - name: name
    type: string
    doc: "The program's name."
  - name: form
    type: string
    doc: "Where the command string stands among its arguments."
    enum: ["shell", "option", "arguments"]
  - name: valueOptions
    type: string[]
    doc: "Its options that take their value as a separate word."
  - name: leadingOperands
    type: int32
    doc: "How many bare words must come before the command-string option."
    constraint_expr: '>= 0'
  - name: currentShell
    type: bool
    doc: "Whether the string runs in the shell that invokes the program instead of a child."
