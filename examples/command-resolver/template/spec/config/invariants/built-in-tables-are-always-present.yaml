predicate: >-
  {@fld:config:Config.wrappers} and {@fld:config:Config.commandStringPrograms} hold an entry
  for every name the built-in tables hold, whether or not a user supplies a configuration;
  which entry, the built-in one or the user's,
  config/user-entry-replaces-the-built-in-of-the-same-name decides.
why: >-
  Adding one program would switch off the looking-through of sudo or bash.
