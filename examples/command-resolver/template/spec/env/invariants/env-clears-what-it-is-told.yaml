predicate: >-
  The program that the env {@ent:config:Wrapper} runs, given `-i`, `--ignore-environment` or
  a lone `-`, or a single-dash cluster holding `i`, has in its {@fld:line:Invocation.env}
  and {@fld:line:Invocation.unknownEnv} only the names env's own assignments set; given `-u
  NAME`, `-uNAME`, `--unset NAME` or `--unset=NAME`, it has NAME in neither unless env's own
