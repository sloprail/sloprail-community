predicate: >-
  A `NAME=value` {@ent:words:Word} before a command's program {@ent:words:Word} puts NAME in
  the {@fld:line:Invocation.env} or the {@fld:line:Invocation.unknownEnv}, as
  env/unknown-value-is-listed-apart says, of that command's {@ent:line:Invocation} and of
  each {@ent:line:Invocation} a chain of {@ent:config:Wrapper}s runs from it (command and
  builtin included), unless one of them has env as its {@fld:config:Wrapper.name} and is
  given an option, or a closer setting decides (env/closest-setting-wins).
why: >-
  A variable set for one command would be missing from it, or leak into the next.
