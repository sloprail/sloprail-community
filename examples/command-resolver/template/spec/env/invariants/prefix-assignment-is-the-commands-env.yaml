predicate: >-
  A {@ent:words:Word} before a command's program {@ent:words:Word} whose
  {@fld:words:Word.text} is `NAME=value`, NAME made of letters, digits and underscores and not
  starting with a digit, puts NAME in
  the {@fld:line:Invocation.env} or the {@fld:line:Invocation.unknownEnv}, as
  env/unknown-value-is-listed-apart says, of that command's {@ent:line:Invocation} and of each
  {@ent:line:Invocation} that {@ent:line:Invocation} runs as a {@ent:config:Wrapper}, directly
  or not (command and builtin included), unless a closer setting decides
  (env/closest-setting-wins). This holds only where none of those {@ent:line:Invocation}s is
  of a {@ent:config:Wrapper} whose {@fld:config:Wrapper.name} is env and that has,
  among its own words after its program word and before the word of the program it runs, one
  whose {@fld:words:Word.text} starts with `-` or that has no {@fld:words:Word.value}.
why: >-
  A variable set for one command would be missing from it, or leak into the next.
