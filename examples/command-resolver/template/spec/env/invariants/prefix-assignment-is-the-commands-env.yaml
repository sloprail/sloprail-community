predicate: >-
  A `NAME=value` {@ent:words:Word} before a command's program word puts NAME in the
  {@fld:line:Invocation.env} or the {@fld:line:Invocation.unknownEnv}, as
  env/unknown-value-is-listed-apart says, of that command's {@ent:line:Invocation} and of
  each {@ent:line:Invocation} of a program a {@ent:config:Wrapper} runs from it, directly or
  through other {@ent:config:Wrapper}s (command and builtin included), none of them the one
  whose {@fld:config:Wrapper.name} is env given an option, unless a closer setting decides
  (env/closest-setting-wins).
why: >-
  A variable set for one command would be missing from it, or leak into the next.
