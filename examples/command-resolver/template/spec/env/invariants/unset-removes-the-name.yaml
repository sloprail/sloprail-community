predicate: >-
  After `unset NAME` or `export -n NAME`, later {@ent:line:Invocation}s of the
  {@ent:line:Scope} have NAME in neither {@fld:line:Invocation.env} nor
  {@fld:line:Invocation.unknownEnv}, up to the next `export` of NAME, except a program
  given NAME by its own prefix or by its {@ent:config:Wrapper}'s assignment; `env -i`
  and `env -u NAME` remove it for the wrapped program.
why: >-
  A removed variable would still be reported as set.
