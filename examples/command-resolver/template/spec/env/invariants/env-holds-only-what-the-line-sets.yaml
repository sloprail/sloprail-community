predicate: >-
  {@fld:line:Invocation.env} and {@fld:line:Invocation.unknownEnv} hold a name only when the
  line sets it for that program: by its command's prefix, by the assignment of the
  {@ent:config:Wrapper} that runs it, by a {@ent:variables:Change} before its command
  (env/export-reaches-later-commands), or by one of these for an Invocation it is nested in
  (env/prefix-assignment-is-the-commands-env); a name that is only in
  {@fld:line:Context.env} is in neither.
why: >-
  Every program would be reported with the whole ambient environment.
