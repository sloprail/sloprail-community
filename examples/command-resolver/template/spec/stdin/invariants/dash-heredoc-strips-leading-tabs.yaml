predicate: >-
  When the command's input redirection (stdin/stdin-is-absent-unless-literal) is a
  {@ent:stdin:HereDocument} whose {@fld:stdin:HereDocument.stripsTabs} is true, the leading
  tabs of every line of its {@fld:stdin:HereDocument.body}, and only tabs, are absent from
  {@fld:line:Invocation.stdin}; they are removed before the {@fld:stdin:HereDocument.body}
  is read for expansion (stdin/unquoted-heredoc-is-expanded-or-absent).
why: >-
  Indentation the shell removes would be reported as input.
