predicate: >-
  When the command's {@ent:stdin:InputRedirection} has a
  {@fld:stdin:InputRedirection.hereDocument} whose {@fld:stdin:HereDocument.quotedDelimiter}
  is true, no expansion is carried out in the command's {@fld:line:Invocation.stdin}: every
  `$`, backtick and backslash of its {@fld:stdin:HereDocument.body} is in it as written.
