predicate: >-
  At a reference whose shell is a {@ent:line:Scope} whose {@fld:line:Scope.kind} is
  child-shell, a {@ent:variables:Variable} that no {@ent:variables:Change} precedes and
  whose {@fld:variables:Variable.name} is not in {@fld:variables:Variable.shellSet} has as
  its {@fld:variables:Variable.value}: the value that {@ent:line:Scope}'s
  {@fld:line:Scope.env} holds for its {@fld:variables:Variable.name}; none when its
  {@fld:line:Scope.unknownEnv} holds the name, or when neither holds it and the name is in
  {@fld:variables:Variable.shellDefaulted}; and the empty string otherwise.
why: >-
  `X=1; bash -c 'rm $X'` would be reported as `rm 1`, where the child shell has no X.
