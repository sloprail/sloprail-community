predicate: >-
  A written word, or each word its brace expressions make of it, none of whose
  {@fld:words:Word.parts} has a {@fld:words:WordPart.cause}, yields one {@ent:words:Word}
  per field of its value: the values unquoted expansions contribute are split at every run
  of space, tab and newline, as POSIX.1-2017 section 2.6.5 splits with IFS unset, the text
  around them joining the first and last field, nothing inside quotes is split, and a word
  with no quoted stretch whose value is empty leaves no field and so yields no
  {@ent:words:Word}. A written word one of whose parts has a cause is not split: it yields
  one {@ent:words:Word} per word its brace expressions make, one when it has none, or the
  one {@ent:words:Word} the limit of words/brace-expansion-yields-several-words leaves.
  Where a {@ent:variables:Change} of IFS precedes the word, each unquoted expansion in it
  that no other invariant gives a cause is instead an entry of {@fld:words:Word.parts} whose
  cause is field-splitting.
why: >-
  `X='a b'; rm $X` would be reported as one file, or `$EMPTY npm` as running nothing.
