predicate: >-
  A {@ent:words:Word} whose text holds a reference `$X` or `${X}`, with no operator, to a
  {@ent:variables:Variable} with no {@fld:variables:Variable.value}, or any reference
  `${X[index]}`, `${X[@]}` or `${X[*]}` with no operator, whatever X's value, has no
  {@fld:words:Word.value}, and that reference is an entry of {@fld:words:Word.parts} whose
  {@fld:words:WordPart.cause} is untracked-variable.
why: >-
