predicate: >-
  A {@ent:words:WordPart} that is a tilde prefix `~` alone contributes the
  {@fld:variables:Variable.value} of the {@ent:variables:Variable} whose
  {@fld:variables:Variable.name} is HOME there, when it has one that is not empty, to the
  {@fld:words:Word.value} of its {@ent:words:Word}, wherever that {@ent:words:Word} stands
  (an entry of {@fld:line:Invocation.argv}, the program word among them, or the
  {@fld:variables:Change.word} of a {@ent:variables:Change} whose
  {@fld:variables:Change.kind} is assignment), that value being neither split
  (variables/unquoted-substitution-splits) nor matched as a pattern
  (words/glob-word-is-unknown); a `~` that starts no tilde prefix is literal text.
why: >-
  A literal `~` would name a different file from the one the shell passes.
