predicate: >-
  An unquoted leading `~` or `~/` in {@fld:words:Word.text} contributes the value of HOME
  in {@fld:line:Context.env} to {@fld:words:Word.value}; a quoted or escaped tilde, or one
  elsewhere in the word, is literal text.
why: >-
