predicate: >-
  In a {@fld:words:Word.value}, of the stretches of its written word (as
  the {@ent:words:Word} doc defines them), the characters that open and close a quoted
  stretch (`'`, `"`, and `$'` with its `$`) are absent from it; a `'…'` stretch appears
  verbatim; an unquoted literal that is a backslash with a character other than a newline
  after it gives that character alone; and the stretches, in order, form one string.
why: >-
  A program spelled `n\pm` or `n""pm` would not be reported as npm.
