doc: "One word of a command, as the shell would pass it."
fields:
  - name: text
    type: string
    doc: "The written word it comes from, quoting included; every Word one written word yields has its text."
  - name: value
    type: string?
    doc: "The string the shell would pass for it; absent when the resolver does not know it."
  - name: unknown
    type: string?
    doc: "Why the word has no value."
    enum: ["command-substitution", "process-substitution", "glob", "special-parameter", "parameter-operation", "arithmetic", "untracked-variable", "user-home", "placeholder"]
  - name: parts
    type: WordPart[]
    doc: "The parts of the written word's text."
    constraint_expr: 'in the order they start; of two that start at the same character, the outer one first'
