predicate: >-
  {@fld:command-strings:CommandString.text} is the value of the string the CommandString
  runs: for the shell and option forms the {@fld:words:Word.value} of the argument that is
  the string, for the arguments form the string
  command-strings/arguments-form-joins-its-arguments makes. It is absent when that string
  has no value; when the CommandString's {@fld:command-strings:CommandString.depth} is above
  3; and when the texts of the CommandStrings read before it already total 1048576 bytes or
  more. CommandStrings are read in this order: those whose programs are written in one text
  (the Line's, or a CommandString's) in the order their program words are written there,
  each followed, before the next, by those whose programs are written in its own text, in
  the same order.
why: >-
  A string that runs itself (`s='eval "$s"'; eval "$s"`) would need an interpreter run
  without end; past the bound it is reported as a string nobody can read.
