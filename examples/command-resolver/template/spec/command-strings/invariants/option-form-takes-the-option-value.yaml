predicate: >-
  For a {@ent:command-strings:CommandString} whose
  {@fld:command-strings:CommandString.program} is a {@ent:config:CommandStringProgram} whose
  {@fld:config:CommandStringProgram.form} is option, the
  {@ent:command-strings:CommandString} is the value of the last `-c` or `--command` option
  among that program's options, as the {@ent:config:CommandStringProgram} defines options
  and their values: the next word after `-c` or `--command`, the rest of the word attached
  to it (`-cX`, `--command=X`), or the word the letter `c` of a single-dash cluster (`-lc`)
  takes; and it is one only when {@fld:config:CommandStringProgram.leadingOperands} bare
  words precede that option.
why: >-
  `su -c 'npm publish'` would hide npm, or `flock -c x file` be misread.
