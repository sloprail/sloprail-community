predicate: >-
  An {@ent:line:Invocation} is looked through as a {@ent:config:Wrapper} when its
  {@fld:line:Invocation.bin} equals the {@fld:config:Wrapper.name} of an entry of
  {@fld:config:Config.wrappers}, however its program word (the first entry of its
  {@fld:line:Invocation.argv}) is quoted or pathed.
why: >-
  `/usr/bin/sudo` or `"sudo"` would hide the program it runs.
