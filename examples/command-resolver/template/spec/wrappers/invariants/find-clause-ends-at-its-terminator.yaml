predicate: >-
  A {@ent:wrappers:FindClause} whose {@fld:wrappers:FindClause.terminator} is `;` ends
  at the first `;` word; `+` closes a clause only directly after `{}`; the words of a
  clause with no terminator are not read as a command.
why: >-
  Words of a second clause, or of no clause at all, would be reported as a command.
