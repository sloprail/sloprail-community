predicate: >-
  A {@ent:config:Wrapper} whose words hold a wrapped program word yields, besides its
  own {@ent:line:Invocation}, one for the wrapped program, whose
  {@fld:line:Invocation.argv} starts at the wrapped program word, unless
  wrappers/describing-options-run-nothing, wrappers/required-options-gate-the-wrapping
