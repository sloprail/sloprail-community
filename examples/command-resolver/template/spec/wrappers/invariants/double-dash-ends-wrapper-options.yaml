predicate: >-
  The `--` that ends a {@ent:config:Wrapper}'s options (as the {@ent:config:Wrapper} doc
  defines it) is never the first entry of the {@fld:line:Invocation.argv} of the
  {@ent:line:Invocation} of the program it runs.
why: >-
  A program whose name starts with a dash would be lost, or `--` reported as a program.
