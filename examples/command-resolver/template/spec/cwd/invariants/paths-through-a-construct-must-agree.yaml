predicate: >-
  Right after an `if`, `case`, `while`, `until` or `for`, or an `&&` or `||` list, the
  {@fld:line:Scope.cwd} is the one it was right before it when every move of the
  {@ent:line:Scope} it is written in (as {@ent:line:Scope} defines a move: none written in a
  {@ent:line:Scope} inside it) that stands inside it is a {@ent:variables:Change} whose
  {@fld:variables:Change.kind} is cd whose {@fld:variables:Change.directory} is that very
  directory, and absent otherwise, even where the moves inside agree with one another; a cd
  that is the first command of an `&&` or `||` list is taken to succeed: it is not inside
  the list, and "right before" is right after it. Inside a `while`, `until` or `for` that
  holds such a move, the {@fld:line:Scope.cwd} is absent from its start up to its first move
  there.
why: >-
  One branch's directory would be reported for all.
