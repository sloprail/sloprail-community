predicate: >-
  After a `cd` whose operand has no {@fld:words:Word.value}, a `pushd` or a `popd`, the
  later Invocations of its {@ent:line:Scope}, and of scopes started there after it, have
  no {@fld:line:Invocation.cwd}, except those that a later `cd` to a known absolute
  path, or a later `cd` with no operand while HOME is set, precedes in their own Scope
  or one enclosing it.
why: >-
  A command would be reported where it no longer is.
