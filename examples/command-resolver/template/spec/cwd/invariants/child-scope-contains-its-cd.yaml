predicate: >-
  Right after a subshell `( … )`, a background job or a pipeline of more than one command, the
  {@fld:line:Scope.cwd} is the one right before it: a move inside one of them changes the
  {@fld:line:Scope.cwd} of no {@ent:line:Scope} outside it.
why: >-
