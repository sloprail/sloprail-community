predicate: >-
  After `A && cd D` or `A || cd D`, where A is not itself the cd, the later
  {@ent:line:Invocation}s of the {@ent:line:Scope} have no {@fld:line:Invocation.cwd}
  unless D is the directory already in force, up to the next `cd` whose destination is a
  known absolute path.
why: >-
  A cd that may not have run would be reported as certain.
