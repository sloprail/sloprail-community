predicate: >-
  Right after an {@ent:line:Invocation} whose {@fld:line:Invocation.bin} is cd, run by the
  shell (as {@ent:line:Invocation} defines it) whose command is no call of a {@ent:line:Function},
  not given -P, with one operand (as cwd/cd-options-are-not-the-destination defines options
  and operands: a cluster such as -LP is an operand) whose
  {@fld:words:Word.value} is a relative path P, the {@fld:line:Scope.cwd} is the one right
  before it joined with P and lexically cleaned, absent when that one is absent. This holds
  when P is `.` or `..` or starts with `./` or `../`; and when P is any other relative path
  but `-` and the empty string, and the {@ent:variables:Variable} whose
  {@fld:variables:Variable.name} is CDPATH has the empty string as its
  {@fld:variables:Variable.value} right before it.
why: >-
  `cd a && cd b` would be reported at b.
