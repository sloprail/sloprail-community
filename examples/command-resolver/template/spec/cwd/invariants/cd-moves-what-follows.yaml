predicate: >-
  A `cd` changes the {@fld:line:Invocation.cwd} of the Invocations after it in the same
  {@ent:line:Scope}, up to the next `cd`, `pushd` or `popd` of that Scope; the cd's own
  cwd is the directory in force before it.
why: >-
  A command would be reported in the directory it left, or cd in the one it is entering.
