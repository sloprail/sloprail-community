predicate: >-
  An {@ent:line:Invocation} whose command stands outside every {@fld:line:Function.body} has
  as its {@fld:line:Invocation.cwd} the {@fld:line:Scope.cwd} of the {@ent:line:Scope} that
  command stands in, right before it, unless one {@ent:config:Wrapper} of its chain (the {@ent:config:Wrapper} it is
  the wrapped program of, that {@ent:config:Wrapper}'s own, and so on) has a word that names
  one of its {@fld:config:Wrapper.directoryOptions} (as the {@ent:config:Wrapper} doc defines
  it).
why: >-
  A program would be reported in a directory other than the one the shell starts it in.
