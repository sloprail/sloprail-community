predicate: >-
  Right after a call of a {@ent:line:Function}, the {@fld:line:Scope.cwd} is the one right
  before the call when no body of a Function of that name holds a move ({@ent:line:Scope}).
  When the line defines the name once and every move its body holds is an Invocation whose
  bin is cd, pushd or popd, it is the Scope.cwd at the end of the body as resolved where the
  Function is defined, if the Scope.cwd right before the call is the one where the Function
  is defined. It is absent otherwise.
why: >-
  A real move would go unreported.
