  whose {@fld:variables:Change.kind} is cd, that {@ent:variables:Change} is read as not
  written on the right side, so it precedes no point there (the reading
  {@ent:variables:Change}'s definition of preceding defers to): at the right side's start
  the {@fld:line:Scope.cwd} is the one right before it, and the {@ent:variables:Variable}s
  whose {@fld:variables:Variable.name} is PWD or OLDPWD have the
  {@fld:variables:Variable.value} and the {@fld:variables:Variable.exported} they had right
