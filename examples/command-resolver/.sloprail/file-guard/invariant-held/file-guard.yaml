# The marked code upholds its invariant, and the marked tests prove it [judge]. One judge for
# both halves: it reads the predicate, the code and the tests of an invariant together, so it
# can tell code that is wrong from a test that is too weak to notice.
#
# One subject per invariant (subjects.sh), each with its own verdict, judged in BATCHES: the
# invariants of a bucket of 10 (buckets.sh) are one judge call, so 99 invariants are 10 calls,
# not 198. An invariant is judged again when its spec file, a file carrying one of its markers,
# or a case file its marked tests name changes; every other invariant keeps its verdict, even
# in the same bucket.
#
# Nothing is inlined into the prompt. prepare.sh hands the judge, per invariant of the batch,
# the path of its spec file and the paths of the files carrying its markers; the judge reads
# them itself (a judge can read the whole project without a grant).
#
# The judge answers with a table (response.schema.json): per invariant, `code` and `tests`,
# each pass or fail, and its own reasoning. post-process.sh holds the table to the invariants
# the judge was given (one missing or unknown: the batch is asked again) and turns each row
# into that invariant's verdict (both halves pass), with the row and where its markers are in
# the judged commit as metadata: `sr-checks show --json` prints it.
#
# That every invariant HAS marked code and a marked test is invariant-covered's, a script.
match: >-
  path matches "^spec/[a-z0-9-]+/invariants/[a-z0-9-]+[.]yaml$"
  or any(markers, .kind == "invariant" or .kind == "proves")
  or any(oldMarkers, .kind == "invariant" or .kind == "proves")
  or path matches "(^|/)testdata/[a-z0-9_]+[.]jsonl$"
subjects: ./subjects.sh
checks:
  - prepare: ./prepare.sh
    judge: ./code-and-tests-hold.md.j2
    response_schema: ./response.schema.json
    post_process: ./post-process.sh
    # A size above the default: on the same commit it named six tests that could not fail for
    # the reason their invariant gives, where the default size (size-md) named one.
    model: size-xl
