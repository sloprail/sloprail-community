# The marked code upholds its invariant, and the marked tests prove it [judge]. One judge for
# both halves: it reads the predicate, the code and the tests of an invariant together, so it
# can tell code that is wrong from a test that is too weak to notice.
#
# Subjects are BUCKETS of 10 invariants (buckets.sh), not one invariant each: 125 invariants
# are 13 judge calls, not 250. A bucket is re-judged when one of its spec files, or a file
# marked for one of its invariants, or a case file (testdata/*.jsonl) beside one of its marked
# tests, changes; the other buckets keep their verdicts.
#
# Nothing is inlined into the prompt. prepare.sh hands the judge, per invariant, the path of
# its spec file and the paths of the files carrying its markers; the judge reads them itself
# (a judge can read the whole project without a grant).
#
# The judge answers with a table (response.schema.json): per invariant, `code` and `tests`,
# each pass or fail. post-process.sh holds the table to the invariants the judge was given
# (one missing or unknown: the judge is asked again), takes the verdict from the table (every
# cell passes; the table wins over the judge's own `pass` when the two disagree), and stores
# the table with the verdict as metadata, with where each invariant's markers are in the
# judged commit: `sr-checks show --json` and `sr-checks log --json` print it.
#
# That every invariant HAS marked code and a marked test is invariant-covered's, a script.
match: >-
  path matches "^spec/[a-z0-9-]+/invariants/[a-z0-9-]+[.]yaml$"
  or any(markers, .kind == "invariant" or .kind == "proves")
  or any(oldMarkers, .kind == "invariant" or .kind == "proves")
  or path matches "(^|/)testdata/[a-z0-9_]+[.]jsonl$"
subjects: ./subjects.sh
checks:
  - prepare: ./prepare.sh
    judge: ./code-and-tests-hold.md.j2
    response_schema: ./response.schema.json
    post_process: ./post-process.sh
    # A size above the default: on the same commit it named six tests that could not fail for
    # the reason their invariant gives, where the default size (size-md) named one.
    model: size-xl
