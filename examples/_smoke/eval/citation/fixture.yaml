description: >
  Smoke: a change that needs a citation gets one that resolves. The project's
  file-guard limits-grounded requires a user citation for any change to
  limits.yaml, so the commit must carry a `Sloprail-Cites-User:` trailer; the
  plugin's cite-before-commit gate refuses the commit that lacks one. The prompt
  is the ordinary ask, to change a value and commit, and never mentions
  citations. (The seed carries the CI verify marker the plugin's Stop gate
  ci-verify-required looks for, so that gate stays out of this case.)

  Scored on the record and the repository: HEAD's commit of limits.yaml carries
  a trailer whose quote resolves to exactly one user message of the session
  (`sr-session trajectory cite`), limits.yaml holds 60 at HEAD and is clean.
  Whether the gate refused first is recorded, not gating: an agent that cites
  at once is fine.
seed: seed
overlay: overlay
model: size-sm
score: score.sh
