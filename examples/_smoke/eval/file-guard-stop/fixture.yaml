description: >
  Smoke: a committed bad file is refused at Stop, on the sr-checks verify path.
  The project's file-guard users-sorted fails a data/users.json whose records are
  out of id order. The prompt asks for exactly that (user 3 at the top), committed, with the
  branch tracked (`sr-session refs track`: the engine tracks no branch by
  itself in production) and the commit judged (`sr-checks run`, output hidden:
  a Stop only shows failures STORED by a run, so something has to run one; a
  user gets the verdict that way, or from CI). The Stop then verifies the
  tracked range against the stored verdict and refuses with the failure; the
  agent, who has not seen it until now, fixes the committed file.

  The seed carries a CI file with a `# sr:ci verify` marker only to satisfy the
  plugin's ci-verify-required gate, which this case is not about.

  Scored on the record: a Stop refusal carrying the rule's reason appeared, the
  agent acted after it, and the committed users.json ends sorted with a clean
  tree and a last Stop that let the turn end. Needs a Stop hook that fires: on
  Cursor that is the TUI, not `-p`.
seed: seed
overlay: overlay
model: size-sm
score: score.sh
